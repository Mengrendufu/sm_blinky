<text x="801" y="763" class="small">setWords / setPair</text>
<path class="edge" d="M640 730 H785"/>
<circle cx="640" cy="730" r="3" fill="#64748b"/>
<rect x="45" y="840" width="450" height="130" rx="5" fill="#fff"
stroke="#a4b2c6"/>
<text x="61" y="862" class="stereo">«component»</text>
<text x="61" y="888" class="title">W_Dial</text>
<path d="M467 855 h14 v20 h-14 z M463 859 h8 v5 h-8 z M463 867 h8 v5 h-8 z"
