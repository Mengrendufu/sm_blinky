orient="auto">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.4"/>
</marker>
</defs>
<style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
fill:#24324a}
 .small{font-size:14px}
 .title{font-size:19px;
font-weight:700}
 .stereo{font-size:13px;
fill:#596981}
 .edge{fill:none;
stroke:#64748b;
stroke-width:1.6;
stroke-dasharray:6 4;
marker-end:url(#arrow)}

</style>
<rect x="15" y="15" width="1250" height="1475" rx="8" fill="#f5f8fc"
stroke="#8c9eb8" stroke-width="2"/>
<text x="40" y="45" class="title">«subsystem» UI</text>
<text x="40" y="73" class="small">当前代码的能力视图 · 所有 LVGL
操作在同一个普通 FreeRTOS UI 线程执行</text>
<rect x="45" y="110" width="350" height="145" rx="5" fill="#edf4ff"
stroke="#a4b2c6"/>
<text x="61" y="132" class="stereo">«component»</text>
<text x="61" y="158" class="title">UI Thread / Inbox</text>
<path d="M367 125 h14 v20 h-14 z M363 129 h8 v5 h-8 z M363 137 h8 v5 h-8 z"
fill="white" stroke="#8394ad"/>
<text x="61" y="186" class="small">接收事件 → 同步派发 → GC</text>
<text x="61" y="208" class="small">持有 HSM 实例；驱动渲染心跳</text>
<text x="61" y="230" class="small">不是 SST_Task / AO</text>
<rect x="480" y="110" width="320" height="145" rx="5" fill="#e7f5f0"
stroke="#a4b2c6"/>
<text x="496" y="132" class="stereo">«component»</text>
<text x="496" y="158" class="title">Sm_Ui · HSM</text>
<path d="M772 125 h14 v20 h-14 z M768 129 h8 v5 h-8 z M768 137 h8 v5 h-8 z"
fill="white" stroke="#8394ad"/>
<text x="496" y="186" class="small">Orchestrator：决定显示内容与时机</text>
<text x="496" y="208" class="small">直接管理组件实例和生命周期</text>
<text x="496" y="230" class="small">Splash / Active / Sys / Live</text>
<rect x="885" y="110" width="350" height="145" rx="5" fill="#fff5df"
stroke="#a4b2c6"/>
<text x="901" y="132" class="stereo">«interface»</text>
<text x="901" y="158" class="title">DisplayOperations</text>
<text x="901" y="186" class="small">requestFrame / setBacklight /
readFps</text>
<text x="901" y="208" class="small">HSM 声明所需能力</text>
<text x="901" y="230" class="small">线程绑定实现，经包装调用 ui_disp</text>
<path class="edge" d="M395 180 H480"/>
<text x="402" y="165" class="stereo">dispatch</text>
<path class="edge" d="M800 180 H885"/>
<text x="818" y="165" class="stereo">uses</text>
<rect x="45" y="300" width="350" height="120" rx="5" fill="#edf4ff"
stroke="#a4b2c6"/>
<text x="61" y="322" class="stereo">«component»</text>
<text x="61" y="348" class="title">UiMetrics</text>
<path d="M367 315 h14 v20 h-14 z M363 319 h8 v5 h-8 z M363 327 h8 v5 h-8 z"
fill="white" stroke="#8394ad"/>
<text x="61" y="376" class="small">sample → CPU / 栈 / 队列 / 池快照</text>
<text x="61" y="398" class="small">不依赖 LVGL；HSM 取数据更新控件</text>
<path class="edge" d="M480 220 H435 V360 H395"/>
<text x="445" y="290" class="stereo">sample</text>
<rect x="885" y="300" width="350" height="120" rx="5" fill="#edf4ff"
stroke="#a4b2c6"/>
<text x="901" y="322" class="stereo">«component»</text>
<text x="901" y="348" class="title">Display Adapter · ui_disp</text>
<path d="M1207 315 h14 v20 h-14 z M1203 319 h8 v5 h-8 z M1203 327 h8 v5 h-8
z" fill="white" stroke="#8394ad"/>
<text x="901" y="376" class="small">LVGL 初始化、渲染心跳、FPS</text>
<text x="901" y="398" class="small">同步 flush → BSP LCD 等待接口</text>
<path class="edge" d="M1060 255 V300"/>
<text x="1075" y="282" class="stereo">绑定能力的调用落点</text>
<text x="45" y="453" class="title">被动显示组件 · 同级排列，由 HSM
通过接口直接驱动</text>
