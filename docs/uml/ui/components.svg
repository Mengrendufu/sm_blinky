<text x="801" y="1063" class="title">W_Ram</text>
<path d="M1207 1030 h14 v20 h-14 z M1203 1034 h8 v5 h-8 z M1203 1042 h8 v5
h-8 z" fill="white" stroke="#8394ad"/>
<text x="801" y="1091" class="small">静态 RAM 使用情况显示</text>
<text x="801" y="1113" class="small">set(usedBytes, totalBytes)</text>
<path class="edge" d="M640 1080 H785"/>
<circle cx="640" cy="1080" r="3" fill="#64748b"/>
<rect x="45" y="1190" width="450" height="130" rx="5" fill="#fff"
stroke="#a4b2c6"/>
<text x="61" y="1212" class="stereo">«component»</text>
<text x="61" y="1238" class="title">W_Dots</text>
<path d="M467 1205 h14 v20 h-14 z M463 1209 h8 v5 h-8 z M463 1217 h8 v5 h-8
z" fill="white" stroke="#8394ad"/>
<text x="61" y="1266" class="small">页面指示点</text>
<text x="61" y="1288" class="small">create(parent, active)</text>
<path class="edge" d="M640 1255 H495"/>
<circle cx="640" cy="1255" r="3" fill="#64748b"/>
<rect x="785" y="1190" width="450" height="130" rx="5" fill="#f1edfb"
stroke="#a4b2c6"/>
<text x="801" y="1212" class="stereo">«library»</text>
<text x="801" y="1238" class="title">LVGL 对象与绘制</text>
<text x="801" y="1266" class="small">上述组件内部调用 LVGL
管理对象和样式</text>
<text x="801" y="1288" class="small">ui_disp 驱动 LVGL 渲染并输出至 LCD</text>
<text x="45" y="1372" class="small">主干只表达共同的 HSM
调用来源，不代表组件之间转发事件或串行调用。</text>
<text x="45" y="1402" class="small">Assets 提供已校验像素；NVM 提供 RAM
快照；TimeEvt 经 Ui_post 投递超时事件。</text>
<text x="45" y="1445" class="stereo">图例：虚线开口箭头 =
调用/使用依赖；圆点 = 共用线段的连接点；外框 = UI 聚合边界。</text>
</svg>
